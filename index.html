:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Layout: panel de trabajo; cabecera fija con pestañas, listas escaneables, fichas en hoja lateral/inferior */
:root{
  --bg:#f8f5f7; --surface:#ffffff; --sunk:#f1ebef; --line:#e4dae1;
  --ink:#2a2230; --muted:#6f6474; --accent:#7a3e65; --accent-ink:#ffffff; --accent-soft:#f1e3ec;
  --ok:#2f7a55; --ok-soft:#e1f3e8; --warn:#9a5f0c; --warn-soft:#fbefd9; --bad:#b03a3a; --bad-soft:#f9e1e1;
  --fucsia:#d4167a; --fucsia-soft:#fde3f0; --verde:#2f9e5f; --verde-soft:#e3f5ea;
  --t1:#3a6fd8; --t2:#8656d6; --t3:#ec8a2a; --t4:#e5bc22; --t5:#d83a3a;
  --display:"Libre Caslon Display", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131a; --surface:#211b24; --sunk:#1b161e; --line:#3a313e;
  --ink:#f1eaf0; --muted:#a99daf; --accent:#d593bd; --accent-ink:#241621; --accent-soft:#3b2636;
  --ok:#7fcfa4; --ok-soft:#1f3329; --warn:#e8b36a; --warn-soft:#3a2c17; --bad:#f08f8f; --bad-soft:#3d2222;
  --fucsia:#ff5cae; --fucsia-soft:#43182f; --verde:#6fd59a; --verde-soft:#1b3326;
  --t1:#6f9cf0; --t2:#ad87f0; --t3:#f5a456; --t4:#f2d35a; --t5:#f07070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131a; --surface:#211b24; --sunk:#1b161e; --line:#3a313e;
  --ink:#f1eaf0; --muted:#a99daf; --accent:#d593bd; --accent-ink:#241621; --accent-soft:#3b2636;
  --ok:#7fcfa4; --ok-soft:#1f3329; --warn:#e8b36a; --warn-soft:#3a2c17; --bad:#f08f8f; --bad-soft:#3d2222;
  --fucsia:#ff5cae; --fucsia-soft:#43182f; --verde:#6fd59a; --verde-soft:#1b3326;
  --t1:#6f9cf0; --t2:#ad87f0; --t3:#f5a456; --t4:#f2d35a; --t5:#f07070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:24px}
.brand small{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
nav.tabs{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 10px 10px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
nav.tabs .n{font-size:11px;background:var(--fucsia);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:22px 0 4px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:600}
.lede{color:var(--muted);margin:0 0 6px;max-width:66ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--fucsia)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;font:inherit;color:inherit;border-left:4px solid transparent;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.hoy{border-left-color:var(--fucsia);background:var(--fucsia-soft)}
.row.aldia{border-left-color:var(--verde)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;color:var(--muted);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.contact{display:flex;gap:4px 14px;font-size:12.5px;flex-wrap:wrap}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cline{font-size:14px;color:var(--muted);margin-top:8px;display:flex;gap:4px 16px;flex-wrap:wrap}
.cline span{user-select:all;color:var(--ink)}
.btn.del{color:var(--bad);border-color:var(--bad)}
.contact a{text-decoration:none}
.sq{width:16px;height:16px;border-radius:4px;flex:none;background:var(--line)}
.sq.Azul{background:var(--t1)}.sq.Violeta{background:var(--t2)}.sq.Naranja{background:var(--t3)}.sq.Amarillo{background:var(--t4)}.sq.Rojo{background:var(--t5)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.fu{background:var(--fucsia);color:#fff}
.chip.link{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--accent)}
.empty{padding:20px 16px;color:var(--muted);text-align:center;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.tools input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.fu{background:var(--fucsia);border-color:var(--fucsia);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 11px;font:600 12.5px var(--body);cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .sq{width:10px;height:10px;border-radius:3px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice.info{background:var(--accent-soft);border-color:transparent}
.notice b{display:block;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr;gap:0 20px}
@media (min-width:780px){.two{grid-template-columns:1fr 1fr}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend span{display:flex;gap:5px;align-items:center}
.legend .sq{width:10px;height:10px}
/* hoja */
.scrim{position:fixed;inset:0;background:rgba(20,12,18,.45);z-index:20}
.sheet{position:fixed;z-index:21;right:0;top:0;bottom:0;width:min(720px,100%);overflow:auto;background:var(--bg);padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:-10px 0 40px rgba(0,0,0,.2)}
@media (max-width:640px){.sheet{top:auto;max-height:94%;border-radius:16px 16px 0 0;padding-top:14px}}
.sheet h2{margin-top:4px;padding-right:40px}
.close{position:absolute;right:14px;top:12px;border:0;background:var(--sunk);color:var(--ink);width:34px;height:34px;border-radius:99px;font-size:18px;cursor:pointer}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.sec>h3{margin:0 0 10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:500}
.form label.check input{width:auto}
.multi{display:flex;flex-wrap:wrap;gap:5px}
.multi label{flex-direction:row !important;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-weight:500 !important;color:var(--ink) !important;background:var(--surface);font-size:13px !important}
.multi input{width:auto;margin:0}
.ro{color:var(--ink);font-weight:500;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13.5px;margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-weight:600}
.kv .big b{font-family:var(--display);font-weight:400;font-size:22px}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.tl .it:first-child{border-top:0}
.tl .d{color:var(--muted);font-size:12.5px}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--ok)}
.doc{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.doc:first-child{border-top:0}
.doc .n{flex:1;min-width:0}
.doc select{width:auto;padding:4px 8px;font-size:13px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline>*{flex:1 1 140px}
.inline .btn{flex:0 0 auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scrollx{overflow-x:auto}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.2);border-radius:99px;padding:13px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40}
.mini{font-size:12.5px;color:var(--muted)}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink)}
.tile b{display:block}
.tile span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:inx .2s ease-out}@keyframes inx{from{transform:translateX(30px);opacity:.6}}}
</style>

const num=v=>v==null||v===""||isNaN(v)?0:Number(v);
const eur=(n,d=0)=>n==null||n===""||isNaN(n)?"—":new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const eur2=n=>eur(n,2);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const addDays=(n,from)=>{const d=from?new Date(from+"T12:00:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const fdate=d=>{if(!d)return"";const x=new Date(String(d).length===10?d+"T12:00:00":d);return isNaN(x)?d:x.toLocaleDateString("es-ES",{day:"numeric",month:"short"})};
const fdateY=d=>{if(!d)return"";const x=new Date(String(d).length===10?d+"T12:00:00":d);return isNaN(x)?d:x.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})};
const fdt=d=>{if(!d)return"";const x=new Date(d);return isNaN(x)?d:x.toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
const arr=v=>v==null?[]:[].concat(v);
const telHref=t=>"tel:"+String(t||"").replace(/[^\d+]/g,"");

const COLS=Object.keys(T);
const byId=(t,id)=>(S.data[t]||[]).find(r=>r._id===id);
const nameOf=(t,id)=>{const r=byId(t,id);return r?(r[T[t].prim]||"Sin nombre"):""};
const r2=n=>Math.round(num(n)*100)/100;
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
function derive(){
  const R=S.raw, D={}; for(const t of COLS) D[t]=(R[t]||[]).map(x=>({...x}));
  const by=(t,k,id)=>D[t].filter(x=>arr(x[k]).includes(id)).map(x=>x._id);
  const td=today();
  for(const c of D.clientes){
    c.integrantes=by("integrantes","cliente",c._id); c.propiedad=by("inmuebles","prop",c._id); c.interes=by("inmuebles","interesados",c._id); c.comprados=by("inmuebles","final",c._id);
    const ints=D.interacciones.filter(x=>arr(x.cli).includes(c._id)); c.nInter=ints.length;
    c.ultima=ints.reduce((m,x)=>{const d=String(x.fecha||"").slice(0,10);return d>m?d:m},"")||null;
    if(c.arch||c.fase==="Cerrado"){c.temp="";c.accion="";}
    else{ const lvl=Math.max(1,(num(c.nivel)||1)-(c.ultima?Math.floor(daysBetween(c.ultima,td)/21):0)); c.temp=TEMPS[Math.min(5,lvl)-1];
      c.accion=(c.nInter===0||(c.prox&&c.prox<=td))?"Acción hoy":"Al día"; }
  }
  for(const i of D.inmuebles){
    i.docs=by("documentos","inm",i._id); i.visitas=by("visitas","inm",i._id); i.ops=by("operaciones","inm",i._id); i.inter=by("interacciones","inm",i._id);
    const ds=D.documentos.filter(d=>arr(d.inm).includes(i._id)); i.docTot=ds.length; i.docOk=ds.filter(d=>["Recibido","No aplica"].includes(d.estado)).length;
    const age=i.anio?new Date().getFullYear()-num(i.anio):0;
    i.insp=i.ccaa==="Madrid"&&["Móstoles","Alcorcón","Parla","Fuenlabrada"].includes(i.muni)&&i.anio&&age>30?"ITE obligatoria (más de 30 años)":i.ccaa==="Castilla-La Mancha"&&i.pisos&&i.anio&&age>50?"IEE obligatorio (pisos de más de 50 años)":i.ccaa?"No aplica":"";
    i.diasFin=i.finEx?daysBetween(td,i.finEx):null; i.diasPub=i.fPub?daysBetween(i.fPub,td):null;
    i.mapa=i.dir?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(i.dir+", "+(i.muni||"")+", España"):"";
    const rc=String(i.rc||"").replace(/\s/g,""); i.catastro=rc.length>=14?`https://www1.sedecatastro.gob.es/CYCBienInmueble/OVCListaBienes.aspx?rc1=${rc.slice(0,7)}&rc2=${rc.slice(7,14)}`:"";
  }
  for(const o of D.operaciones){
    const tipo=num(String(o.pct||"").replace("%",""))/100; o.hon=r2(num(o.precio)*tipo); o.iva=r2(o.hon*0.21); o.total=r2(o.hon+o.iva);
    o.reserva=r2(num(o.precio)*0.01); o.limite=o.fReserva?addDays(15,o.fReserva):null; o.aviso=o.fNotaria?addDays(-10,o.fNotaria):null;
    const inm=D.inmuebles.find(x=>x._id===arr(o.inm)[0]); o.vend=inm?arr(inm.prop):[];
    o.reparto=by("reparto","op",o._id); o.facturas=by("facturas","op",o._id);
    o.sumaRep=r2(D.reparto.filter(x=>arr(x.op).includes(o._id)).reduce((s,x)=>s+num(x.importe),0));
    o.pendNot=r2(num(o.precio)-num(o.arras)-(o.estReserva==="Aplicada a la compraventa"?o.reserva:0));
    o.neto=r2(num(o.precio)-o.total-num(o.hipo));
    o.cuadre=!o.sumaRep?"Sin reparto":Math.abs(o.sumaRep-o.pendNot)<0.01?"Cuadra":"Descuadre de "+eur2(o.pendNot-o.sumaRep);
  }
  const trim=d=>d?String(d).slice(0,4)+"-T"+Math.ceil(Number(String(d).slice(5,7))/3):"";
  for(const f of D.facturas){ f.cuota=r2(num(f.base)*num(f.tipoIva)); f.impRet=r2(num(f.base)*num(f.ret)); f.total=r2(num(f.base)+f.cuota-f.impRet); f.trim=trim(f.fecha); }
  for(const g of D.gastos){ g.cuota=r2(num(g.base)*num(g.tipoIva)); g.total=r2(num(g.base)+g.cuota); g.trim=trim(g.fecha); }
  S.data=D;
}

async function api(path,opt={}){
  const h={Authorization:"Token "+TOKEN}; if(opt.body&&!(opt.body instanceof FormData)) h["Content-Type"]="application/json";
  let r; try{ r=await fetch(API+path,{...opt,headers:h}); }catch(e){ const x=new Error("Sin conexión"); x.code="net"; throw x; }
  if(!r.ok){ let m=""; try{ const j=await r.json(); m=j.detail||j.error||JSON.stringify(j); }catch{} if(typeof m!=="string") m=JSON.stringify(m); const x=new Error(m||r.statusText); x.code=r.status===401?"auth":r.status===429?"rate":r.status===404?"notfound":"http"; throw x; }
  return r.status===204?null:r.json();
}
async function discover(){
  const tabs=await api("/api/database/tables/all-tables/");
  const miss=[]; for(const t of COLS){ const m=tabs.find(x=>x.name===TNAME[t]); if(m) TID[t]=m.id; else miss.push(TNAME[t]); }
  if(miss.length){ const e=new Error("Faltan tablas en Baserow: "+miss.join(", ")); e.code="schema"; throw e; }
  await Promise.all(COLS.map(async t=>{ try{ const fs=await api(`/api/database/fields/table/${TID[t]}/`); FMETA[t]=Object.fromEntries(fs.map(f=>[f.name,f])); }catch{ FMETA[t]=null; } }));
}
function fromRow(t,row){
  const o={_id:String(row.id)};
  for(const k in FN[t]){ let v=row[FN[t][k]]; if(v===undefined) continue;
    if(Array.isArray(v)){ if((FILES[t]||[]).includes(k)) v=v.map(f=>({id:f.name,name:f.visible_name||f.name,url:f.url}));
      else if((LINKS[t]||[]).includes(k)) v=v.map(x=>String(x&&typeof x==="object"?x.id:x));
      else v=v.map(x=>x&&typeof x==="object"?(x.value??x.name):x); }
    else if(v&&typeof v==="object") v=v.value??null;
    if(v==="") v=null;
    if(v!=null&&isNumK(t,k)) v=Number(v);
    if((PCT[t]||[]).includes(k)&&v!=null) v=v>1?v/100:v;
    o[k]=v; }
  return o;
}
function toPayload(t,obj){
  const out={};
  for(const k in obj){ const name=FN[t][k]; if(!name) continue; let v=obj[k]; const meta=FMETA[t]&&FMETA[t][name];
    if((LINKS[t]||[]).includes(k)) v=arr(v).map(Number);
    else if((FILES[t]||[]).includes(k)) v=arr(v).map(f=>({name:f.id}));
    else if((PCT[t]||[]).includes(k)) v=v==null?null:Math.round(Number(v)*100);
    else if(meta&&meta.type==="single_select") v=v==null||v===""?null:(((meta.select_options||[]).find(o=>o.value===v)||{}).id??v);
    else if(meta&&meta.type==="multiple_select") v=arr(v).map(x=>((meta.select_options||[]).find(o=>o.value===x)||{}).id??x);
    else if(meta&&meta.type==="boolean") v=!!v;
    out[name]=v; }
  return out;
}
async function loadTable(t){
  let rows=[],page=1;
  while(true){ const r=await api(`/api/database/rows/table/${TID[t]}/?user_field_names=true&size=200&page=${page}`); rows=rows.concat(r.results||[]); if(!r.next) break; page++; }
  S.raw[t]=rows.map(x=>fromRow(t,x)); delete S.err[t];
}
let loading=false, again=false;
async function loadAll(silent){
  if(loading){ again=true; return; } loading=true; if(!silent) $("#status").textContent="Actualizando…";
  const q=[...COLS]; const work=async()=>{ while(q.length){ const t=q.shift(); try{ await loadTable(t); }catch(e){ S.err[t]=e; } } };
  await Promise.all([work(),work(),work(),work()]);
  loading=false; S.loaded=true;
  $("#status").textContent=Object.keys(S.err).length?"Con errores":"Al día · "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  derive(); repaint();
  if(again){ again=false; loadAll(true); }
}
function reloadSoon(){ clearTimeout(rT); rT=setTimeout(()=>loadAll(true),350); }
function repaint(){
  const ae=document.activeElement;
  if(S.sheet){ renderTabs(); const sh=$(".sheet"); if(!S.sheet.dirty&&!S.sheet.quick&&!(sh&&sh.contains(ae)&&ae.matches("input,textarea,select"))) drawSheet(); return; }
  if(ae&&$("#view").contains(ae)&&ae.matches("input,textarea,select")){ S.pending=true; return; }

async function create(t,obj){ const r=await api(`/api/database/rows/table/${TID[t]}/?user_field_names=true`,{method:"POST",body:JSON.stringify(toPayload(t,obj))}); const row=fromRow(t,r); (S.raw[t]=S.raw[t]||[]).push(row); derive(); reloadSoon(); return String(r.id); }
async function createMany(t,list){ for(let i=0;i<list.length;i+=100){ await api(`/api/database/rows/table/${TID[t]}/batch/?user_field_names=true`,{method:"POST",body:JSON.stringify({items:list.slice(i,i+100).map(o=>toPayload(t,o))})}); } reloadSoon(); }
async function update(t,id,obj){
  if(t==="config"&&(!id||!byId(t,id))) return create(t,obj);
  const r=await api(`/api/database/rows/table/${TID[t]}/${id}/?user_field_names=true`,{method:"PATCH",body:JSON.stringify(toPayload(t,obj))});
  const i=(S.raw[t]||[]).findIndex(x=>x._id===String(id)); if(i>=0&&r) S.raw[t][i]=fromRow(t,r); derive(); reloadSoon();
}
async function remove(t,ids){ ids=arr(ids).filter(Boolean); if(!ids.length) return; await api(`/api/database/rows/table/${TID[t]}/batch-delete/`,{method:"POST",body:JSON.stringify({items:ids.map(Number)})}); S.raw[t]=(S.raw[t]||[]).filter(x=>!ids.includes(x._id)); derive(); reloadSoon(); }

async function borrar(t,id){
  const own=(tt,k)=>(S.data[tt]||[]).filter(x=>arr(x[k]).includes(id)).map(x=>x._id);
  const strip=async(tt,k)=>{ for(const x of (S.data[tt]||[]).filter(x=>arr(x[k]).includes(id))) await update(tt,x._id,{[k]:arr(x[k]).filter(v=>v!==id)}); };
  if(t==="clientes"){ await remove("integrantes",own("integrantes","cliente")); await remove("interacciones",own("interacciones","cli"));
    for(const k of ["prop","interesados","final"]) await strip("inmuebles",k); await strip("operaciones","comp"); await strip("visitas","comp"); await strip("agenda","cli"); await strip("frio","cli"); await strip("facturas","cli"); }
  if(t==="inmuebles"){ await remove("documentos",own("documentos","inm")); await remove("visitas",own("visitas","inm")); await strip("operaciones","inm"); await strip("interacciones","inm"); await strip("agenda","inm"); await strip("clientes","entrada"); }
  if(t==="operaciones"){ await remove("reparto",own("reparto","op")); await strip("agenda","op"); await strip("facturas","op"); }
  await remove(t,[id]);
}

function errText(e){
  const c=e&&e.code;
  if(c==="auth") return ["Token no válido","Revisa el token de Baserow en Ajustes → Cambiar token."];
  if(c==="rate") return ["Demasiadas peticiones seguidas","Espera unos segundos y vuelve a intentarlo."];
  if(c==="net") return ["Sin conexión","Comprueba que tienes internet y vuelve a intentarlo."];
  if(c==="schema") return ["La base de Baserow no está completa",e.message];
  if(c==="notfound") return ["No encontrado","Puede que alguien lo haya borrado. Recarga la app."];
  return ["No se pudo guardar",(e&&e.message)||"Vuelve a intentarlo."];
}
async function act(btn,fn,ok){
  const prev=btn?btn.textContent:""; if(btn){btn.disabled=true;btn.textContent="…";}
  try{ await fn(); if(ok) toast(ok); return true; }
  catch(e){ const [a,b]=errText(e); toast(a); console.warn(e,b); return false; }
  finally{ if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=prev;} }
}

const cfg=()=>(S.data.config||[])[0]||{};
const activeCli=r=>!r.arch;
const precioInm=i=>num(i.pActual)||num(i.pSalida)||num(i.val);
function cruce(c,i){
  const imp=new Set(arr(c.impres)); const crit=[];
  const p=precioInm(i), presu=num(c.presu);
  const add=(name,has,ok)=>{ if(has) crit.push({name,ok:!!ok,imp:imp.has(name)}); };
  add("Zona",arr(c.zonas).length,arr(c.zonas).includes(i.muni));
  add("Tipo",arr(c.tipos).length,arr(c.tipos).includes(i.tipo));
  add("Habitaciones",c.habMin,num(i.hab)>=num(c.habMin));
  add("Baños",c.banosMin,num(i.banos)>=num(c.banosMin));
  add("Superficie",c.m2Min,num(i.m2)>=num(c.m2Min));
  add("Estado",arr(c.estadoB).length,arr(c.estadoB).includes(i.estado));
  add("Planta",arr(c.plantaB).length,arr(c.plantaB).includes(i.planta));
  add("Eficiencia",arr(c.eficB).length,arr(c.eficB).includes(i.efic));
  for(const ch of arr(c.caractB)) add(ch,true,arr(i.caract).includes(ch));
  const priceOk=!presu||(p&&p<=presu), pricePos=!presu||(p&&p<=presu*1.10);
  const okN=crit.filter(x=>x.ok).length+(priceOk?1:0), tot=crit.length+1;
  const score=okN/tot;
  const total=priceOk&&crit.every(x=>x.ok);
  const impOk=crit.filter(x=>x.imp).every(x=>x.ok);
  const posible=!total&&pricePos&&impOk&&score>=0.75;
  return {total,posible,score,falla:crit.filter(x=>!x.ok).map(x=>x.name).concat(priceOk?[]:["Precio"])};
}
const inmVenta=()=>(S.data.inmuebles||[]).filter(i=>!i.arch&&["Exclusiva firmada","En venta","Reservado"].includes(i.fase));
const compradores=()=>(S.data.clientes||[]).filter(c=>activeCli(c)&&arr(c.rol).includes("Comprador"));
function crucesDe(c){ const t=[],p=[]; for(const i of inmVenta()){ const m=cruce(c,i); if(m.total)t.push([i,m]); else if(m.posible)p.push([i,m]); } return {t,p}; }
function crucesInm(i){ const t=[],p=[]; for(const c of compradores()){ const m=cruce(c,i); if(m.total)t.push([c,m]); else if(m.posible)p.push([c,m]); } return {t,p}; }

async function registrar(cli,o){
  const c=byId("clientes",cli); const cf=cfg(); const lim=num(cf.toques)||5;
  let nivel=num(c.nivel)||1, toques=num(c.toques), fase=c.fase||"Nuevo", prox=o.prox||"";
  const upd={};
  const r=o.resultado;
  if(o.tipo==="Videollamada"){
    upd.fVideo=today(); if(o.valoracion) upd.valoracion=Number(o.valoracion); if(r) upd.resVideo=r;
    if(r==="Sí"){nivel=5;fase="Exclusiva firmada";toques=0;if(!prox)prox=addDays(7);}
    else if(r==="Quizás"){nivel=4;fase="Nurturing";toques=0;if(!prox)prox=addDays(14);}
    else if(r==="No"){nivel=2;fase="Nurturing";toques=0;if(!prox)prox=addDays(30);}
    else { fase="Videollamada hecha"; }
  } else if(r==="No contesta"){ toques++; if(!prox) prox=addDays(2); if(toques>=lim){fase="Dormido";prox=addDays(45);} }
  else if(r==="Responde"){ nivel=Math.max(nivel,2); toques=0; if(fase==="Nuevo"||fase==="Dormido") fase=arr(c.rol).includes("Comprador")&&!arr(c.rol).includes("Vendedor")?"Buscando":"Contactado"; }
  else if(r==="Interesado"){ nivel=Math.max(nivel,3); toques=0; if(fase==="Nuevo"||fase==="Dormido"||fase==="Contactado") fase=arr(c.rol).includes("Comprador")&&!arr(c.rol).includes("Vendedor")?"Buscando":"Contactado"; }
  else if(r==="Sí"){ nivel=5; toques=0; }
  else if(r==="Quizás"){ nivel=Math.max(nivel,3); toques=0; if(!prox) prox=addDays(14); }
  else if(r==="No"){ nivel=Math.min(nivel,2); toques=0; if(!prox) prox=addDays(30); }
  if(o.tipo==="Visita"&&(r==="Interesado"||r==="Sí")) nivel=Math.max(nivel,4);
  Object.assign(upd,{nivel,toques,fase});
  if(prox) upd.prox=prox; else if(o.clearProx) upd.prox=null;
  const resumen=o.tipo+(r?" · "+r:"")+(o.nota?" — "+o.nota.slice(0,60):"");
  await create("interacciones",{res:resumen,tipo:o.tipo,fecha:new Date().toISOString(),resultado:r||null,nota:o.nota||null,cli:[cli],inm:o.inm?[o.inm]:[]});
  await update("clientes",cli,upd);
  await refresh("interacciones","clientes");
}

function inputFor(t,[k,fid,label,type,opt,grp],val){
  const id=`f-${t}-${k}`; if(type==="ro"||type==="hidden") return "";
  const full=opt==="full"||type==="textarea"||type==="multi"?" full":"";
  if(type==="check") return `<label class="check${full}"><input type="checkbox" id="${id}" ${val?"checked":""}> ${esc(label)}</label>`;
  if(type==="select") return `<label class="${full}">${esc(label)}<select id="${id}"><option value="">—</option>${opt.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  if(type==="multi"){const set=new Set(arr(val));return `<div class="full"><label>${esc(label)}</label><div class="multi" id="${id}">${opt.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${set.has(o)?"checked":""}>${esc(o)}</label>`).join("")}</div></div>`;}
  if(type==="link"||type==="links"){const cur=arr(val)[0]||"";const list=(S.data[opt]||[]).filter(r=>!r.arch||r._id===cur);return `<label class="${full}">${esc(label)}<select id="${id}"><option value="">—</option>${list.map(r=>`<option value="${r._id}" ${r._id===cur?"selected":""}>${esc(r[T[opt].prim]||"Sin nombre")}</option>`).join("")}</select></label>`;}
  if(type==="textarea") return `<label class="full">${esc(label)}<textarea id="${id}">${esc(val||"")}</textarea></label>`;
  const it={text:"text",tel:"tel",email:"email",url:"url",money:"number",number:"number",pct:"number",date:"date",datetime:"datetime-local"}[type]||"text";
  let v=val??""; if(type==="pct"&&v!=="") v=Math.round(v*10000)/100;
  if(type==="datetime"&&v){const d=new Date(v);if(!isNaN(d))v=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
  return `<label class="${full.trim()}">${esc(label)}<input type="${it}" id="${id}" value="${esc(v)}" ${it==="number"?'inputmode="decimal" step="any"':""}></label>`;
}
function readForm(t,orig,only){
  const out={};
  for(const d of T[t].f){ const [k,fid,,type]=d; if(type==="ro"||type==="hidden") continue; if(only&&!only.includes(k)) continue;
    const el=document.getElementById(`f-${t}-${k}`); if(!el) continue; let v;
    if(type==="check") v=el.checked; else if(type==="multi") v=[...el.querySelectorAll("input:checked")].map(i=>i.value);
    else if(type==="link"||type==="links") v=el.value?[el.value]:[];
    else if(type==="money"||type==="number") v=el.value===""?null:Number(el.value);
    else if(type==="pct") v=el.value===""?null:Number(el.value)/100;
    else if(type==="datetime") v=el.value?new Date(el.value).toISOString():null;
    else v=el.value===""?null:el.value;
    if(type==="links"&&orig){ const rest=arr(orig[k]).slice(1); v=v.concat(rest.filter(x=>!v.includes(x))); }
    if(orig){ const o=orig[k]; const a=JSON.stringify(type==="link"?arr(o).slice(0,1):type==="links"?arr(o):(o??(type==="check"?false:type==="multi"?[]:null))); if(a===JSON.stringify(v)) continue; }
    else if(v==null||v===false||(Array.isArray(v)&&!v.length)) continue;
    out[k]=v;
  }
  return out;
}

function informe(i){
  const desde=addDays(-7), hasta=today();
  const vis=(S.data.visitas||[]).filter(v=>arr(v.inm).includes(i._id)&&String(v.fecha||"").slice(0,10)>=desde);
  const ints=(S.data.interacciones||[]).filter(x=>arr(x.inm).includes(i._id)&&String(x.fecha||"").slice(0,10)>=desde);
  const allV=(S.data.visitas||[]).filter(v=>arr(v.inm).includes(i._id)&&v.estado!=="Cancelada");
  const op={Caro:0,Justo:0,Barato:0}; allV.forEach(v=>{if(op[v.opin]!=null)op[v.opin]++});
  const media=allV.filter(v=>v.val).length?(allV.reduce((s,v)=>s+num(v.val),0)/allV.filter(v=>v.val).length).toFixed(1):null;
  let rec="Mantener el precio y seguir con la difusión.";
  if(allV.length>=3&&op.Caro>allV.length/2) rec="La mayoría de visitas percibe el precio alto. Propongo revisar el precio para ajustarlo al mercado.";
  else if(allV.length===0&&num(i.diasPub)>=21) rec="Tres semanas sin visitas: propongo revisar precio, fotos y descripción.";
  else if(vis.some(v=>v.interes==="Alto")) rec="Hay interés alto: seguimos de cerca para convertirlo en oferta.";
  return `Informe semanal · ${i.ref||""}${i.muni?" ("+i.muni+")":""}
Del ${fdateY(desde)} al ${fdateY(hasta)}

Precio actual: ${eur(precioInm(i))}
Días publicada: ${i.diasPub!=null?num(i.diasPub):"—"}

Visitas esta semana: ${vis.length}
${vis.map(v=>`· ${fdate(v.fecha)}: interés ${String(v.interes||"—").toLowerCase()}, precio ${String(v.opin||"—").toLowerCase()}${v.fb?". "+v.fb:""}`).join("\n")||"· Ninguna"}

Contactos y gestiones esta semana: ${ints.length}
Visitas totales: ${allV.length}${media?` · valoración media ${media}/5`:""}
Percepción del precio: caro ${op.Caro} · justo ${op.Justo} · barato ${op.Barato}

Recomendación: ${rec}

Magnolia Living`;
}

    const cli=arr(o.vend)[0];
    await act(el,async()=>{ await create("facturas",{num:numF,fecha:today(),concepto:`Honorarios por intermediación en la compraventa de ${nameOf("inmuebles",arr(o.inm)[0],o,"inm")}`,base:num(o.hon),tipoIva:num(c.iva)||0.21,ret:0,cli:cli?[cli]:[],op:[o._id]});
      await update("config",c._id||"main",{prox:n+1}); await refresh("facturas","config","operaciones"); },"Factura "+numF+" creada"); drawSheet(); return; }
  if(a==="saveconfig"){ const c=cfg(); const obj=readForm("config",c); if(!Object.keys(obj).length){toast("Sin cambios");return;} await act(el,async()=>{await update("config",c._id||"main",obj);await refresh("config");},"Guardado"); render(); return; }
  if(a==="addpl"){ const n=$("#pl-n").value.trim(); if(!n) return; await act(el,async()=>{await create("plantillas",{nombre:n,notas:$("#pl-u").value.trim()||null});await refresh("plantillas");},"Añadida"); render(); return; }
  if(a==="convertir"){ const f=cur; await act(el,async()=>{ const id=await create("clientes",{nombre:f.anunciante||f.anuncio,rol:["Vendedor"],tel:f.tel,email:f.email,origen:"Captación en frío",fase:"Contactado",nivel:2,notas:[f.url,f.notas].filter(Boolean).join("\n")});
      await update("frio",f._id,{estado:"Convertido",cli:[id]}); await refresh("clientes","frio"); S.newId=id; },"Convertido en vendedor"); if(S.newId) openSheet("clientes",S.newId); return; }
  if(a==="frio-cont"){ await act(el,async()=>{await update("frio",cur._id,{estado:"Contactado",prox:addDays(3)});await refresh("frio");},"Hecho"); drawSheet(); return; }
  if(a==="frio-desc"||a==="frio-inmo"){ const inmo=a==="frio-inmo";
    if(!confirm(inmo?"¿Es de inmobiliaria? Saldrá de la app y quedará guardado en tu hoja de stock de agencias.":"¿Descartar este anuncio? Saldrá de la app y quedará registrado en la hoja de captación.")) return;
    await act(el,async()=>{await update("frio",cur._id,{estado:"Descartado",notas:(inmo?"[Inmobiliaria] ":"")+(cur.notas||"")});await refresh("frio");},inmo?"Marcado como inmobiliaria":"Descartado"); drawSheet(); return; }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-upload]"); if(!b||!TOKEN) return; e.stopPropagation();
  const [t,id,f]=b.dataset.upload.split(":"); const inp=document.createElement("input"); inp.type="file"; inp.multiple=true;
  inp.onchange=async()=>{ const files=[...inp.files]; if(!files.length) return; b.disabled=true; b.textContent="Subiendo…";
    try{ const add=[]; for(const fl of files){ add.push(await uploadFile(fl)); }
      const cur=byId(t,id)||{}; await update(t,id,{[f]:arr(cur[f]).concat(add),...(t==="documentos"?{estado:"Recibido",fRec:today()}:{})}); toast(files.length>1?"Archivos subidos":"Archivo subido");
    }catch(err){ const [a]=errText(err); toast(a); } finally{ b.disabled=false; b.textContent="Subir"; } };
  inp.click();
},true);
document.addEventListener("click",async e=>{ const b=e.target.closest("[data-copy]"); if(!b) return; try{await navigator.clipboard.writeText(b.dataset.copy);toast("Email copiado");}catch{toast(b.dataset.copy);} });
document.addEventListener("input",e=>{ if(S.sheet&&e.target.closest(".sheet")&&!e.target.closest("[data-calc]")) S.sheet.dirty=true; });
document.addEventListener("focusout",()=>{ if(S.pending&&!S.sheet){ setTimeout(()=>{ const ae=document.activeElement; if(!(ae&&$("#view").contains(ae)&&ae.matches("input,textarea,select"))){S.pending=false;render();} },50); } });
document.addEventListener("change",async e=>{
  const s=e.target.closest("[data-docst]"); if(s){ const v=s.value; s.disabled=true; await act(null,async()=>{await update("documentos",s.dataset.docst,v==="Recibido"?{estado:v,fRec:today()}:{estado:v});await refresh("documentos","inmuebles");}); drawSheet(); return; }
});
document.addEventListener("input",e=>{ const c=e.target.closest("[data-calc]"); if(c){ const id=c.dataset.calc; $("#"+id+"-out").innerHTML=calcOut($("#"+id+"-p").value,$("#"+id+"-pct").value,$("#"+id+"-h").value); }});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sheet) closeSheet(); if(e.key==="Enter"&&e.target.matches(".row[role=button]")) e.target.click(); });
$("#fab").addEventListener("click",()=>{
  const p={vendedores:["clientes",{rol:["Vendedor"],fase:"Nuevo",nivel:1}],compradores:["clientes",{rol:["Comprador"],fase:"Nuevo",nivel:1}],frio:["frio",{estado:"Nuevo",fDet:today()}],inmuebles:["inmuebles",{fase:"Captación"}],operaciones:["operaciones",{fase:"Oferta",pct:"5%",fOferta:today()}],agenda:["agenda",{estado:"Pendiente",prio:"Media"}]}[S.tab];
  if(p) openSheet(p[0],null,p[1]);
});

/* ---------- arranque y refresco ---------- */
renderTabs();
(async()=>{
  if(!TOKEN){ $("#status").textContent="Sin conectar";
    $("#view").innerHTML=`<h2>Conectar con Baserow</h2><p class="lede">Pega el token de base de datos de Baserow (Ajustes → Tokens de base de datos). Se guarda solo en este dispositivo.</p><div class="sec"><div class="inline"><label class="mini">Token<input id="tok" autocomplete="off" placeholder="Pega aquí el token"></label><button class="btn pri" data-act="savetoken">Conectar</button></div></div>`; return; }
  try{ await discover(); }catch(e){ const [t,m]=errText(e); $("#status").textContent="Sin conectar";
    $("#view").innerHTML=`<h2>${esc(t)}</h2><p class="lede">${esc(m)}</p><div class="actions" style="justify-content:flex-start"><button class="btn" onclick="location.reload()">Reintentar</button><button class="btn del" data-act="logout">Cambiar token</button></div>`; return; }
  await loadAll();
  setInterval(()=>{ if(document.visibilityState==="visible"&&!(S.sheet&&(S.sheet.dirty||S.sheet.quick))) loadAll(true); },60000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadAll(true); });
})();
</script>
</body>
</html>
